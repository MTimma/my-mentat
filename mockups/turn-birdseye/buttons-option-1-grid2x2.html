<!DOCTYPE html>
<html lang="en" data-theme="void">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buttons 1 — 2×2 grid</title>
  <link rel="stylesheet" href="_shared-mockup.css?v=5" />
</head>
<body class="mockup-page">
  <header class="mockup-page-header">
    <h1>Buttons 1 — 2×2 grid</h1>
    <p>Play / Rev / Intr / Tech. Sits to the <strong>left of the active combat portrait</strong> only.</p>
    <nav class="mockup-nav">
      <a href="README.md">Index</a>
      <a href="buttons-option-2-stacked3.html">Option 2</a>
      <a href="desktop-full-layout.html">Desktop</a>
    </nav>
  </header>
  <main class="mockup-content">
    <div class="turn-seat-row" style="max-width:420px;">
      <div class="turn-seat-row__controls">
        <div class="btn-grid-2x2">
          <button type="button" class="action-btn action-btn--play">
            <span class="action-btn__label">Play</span>
            <span class="action-btn__agent-badge"><img src="assets/agent.png" alt="" />2</span>
          </button>
          <button type="button" class="action-btn action-btn--reveal">
            <span class="action-btn__count">3</span>
            <span class="action-btn__label">Rev</span>
          </button>
          <button type="button" class="action-btn action-btn--intrigue">
            <img src="assets/intrigue.png" alt="" />
            <span class="action-btn__count--overlay">2</span>
          </button>
          <button type="button" class="action-btn action-btn--tech">
            <img src="assets/tech.png" alt="" />
            <span class="action-btn__label">Tech</span>
          </button>
        </div>
      </div>
      <div class="turn-seat-row__portrait">
        <div class="combat-dock">
          <div class="combat-seat combat-seat--active">
            <div class="combat-quadrant combat-quadrant--red">
              <div class="combat-leader"><img src="assets/paul.avif" alt="Paul" /></div>
              <div class="combat-resources">
                <div class="combat-resources-grid">
                  <span class="combat-res"><img src="assets/spice.png" alt="" />4</span>
                  <span class="combat-res"><img src="assets/solari.png" alt="" />7</span>
                  <span class="combat-res"><img src="assets/water.png" alt="" />1</span>
                  <span class="combat-res"><img src="assets/troop.png" alt="" />5</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
