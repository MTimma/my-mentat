<!DOCTYPE html>
<html lang="en" data-theme="void">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Turn history — collapsed gains</title>
  <link rel="stylesheet" href="_shared-mockup.css?v=5" />
  <style>
    .history-demo {
      max-width: 320px;
      border: 1px solid var(--chrome-border-accent);
      border-radius: 8px;
      background: var(--chrome-panel-gradient);
      overflow: hidden;
    }
  </style>
</head>
<body class="mockup-page">
  <header class="mockup-page-header">
    <h1>Turn history — past turns only</h1>
    <p>
      Default: leader head + “Card → Space” / “Reveal”. Gains toggled per row.
      This is <strong>not</strong> the current-turn gains next to combat portraits.
    </p>
    <nav class="mockup-nav">
      <a href="README.md">Index</a>
      <a href="desktop-full-layout.html">Desktop</a>
    </nav>
  </header>
  <main class="mockup-content">
    <div class="history-demo">
      <div class="desk-history__header">Turn history</div>
      <div style="padding:6px 0 10px;">
        <div class="th-row">
          <input type="checkbox" id="th1" class="th-row__toggle" />
          <label class="th-row__header" for="th1">
            <span class="th-row__turn">T4</span>
            <div class="leader-head"><img src="assets/paul-head.png" alt="" /></div>
            <span class="th-row__action">Signet Ring → Hagga Basin</span>
            <span class="th-row__toggle-icon"></span>
          </label>
          <div class="th-row__gains gains-style-b">
            <div class="gains-display">
              <div class="gain-group">
                <span class="gain-title">Signet Ring → Hagga Basin</span>
                <div class="gain-flow">
                  <span class="gain-side gain-side--cost"><img src="assets/water.png" alt="" class="gain-icon" /><span class="gain-amt gain-amt--cost">1</span></span>
                  <span class="gain-arrow">→</span>
                  <span class="gain-side gain-side--reward"><img src="assets/spice.png" alt="" class="gain-icon" /><span class="gain-amt gain-amt--gain">4</span></span>
                </div>
              </div>
              <div class="gain-group">
                <span class="gain-title">Deployed</span>
                <div class="gain-flow">
                  <span class="gain-side gain-side--cost"><img src="assets/deploy.png" alt="" class="gain-icon" /><span class="gain-amt gain-amt--cost">2</span></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="th-row">
          <input type="checkbox" id="th2" class="th-row__toggle" />
          <label class="th-row__header" for="th2">
            <span class="th-row__turn">T3</span>
            <div class="leader-head leader-head--green"><img src="assets/helena-head.png" alt="" /></div>
            <span class="th-row__action">Reveal</span>
            <span class="th-row__toggle-icon"></span>
          </label>
          <div class="th-row__gains gains-style-b">
            <div class="gain-flow">
              <span class="gain-side gain-side--reward"><img src="assets/spice.png" alt="" class="gain-icon" /><span class="gain-amt gain-amt--gain">2</span></span>
              <span class="gain-side gain-side--reward"><span class="gain-persuasion-diamond"></span><span class="gain-amt gain-amt--gain">4</span></span>
              <span class="gain-side gain-side--reward"><img src="assets/sword.png" alt="" class="gain-icon" /><span class="gain-amt gain-amt--gain">3</span></span>
            </div>
          </div>
        </div>

        <div class="th-row">
          <input type="checkbox" id="th3" class="th-row__toggle" />
          <label class="th-row__header" for="th3">
            <span class="th-row__turn">T2</span>
            <div class="leader-head leader-head--blue"><img src="assets/baron-head.png" alt="" /></div>
            <span class="th-row__action">Duncan Idaho → Carthag</span>
            <span class="th-row__toggle-icon"></span>
          </label>
          <div class="th-row__gains gains-style-b">
            <div class="gain-flow">
              <span class="gain-side gain-side--reward"><img src="assets/troop.png" alt="" class="gain-icon" /><span class="gain-amt gain-amt--gain">1</span></span>
              <span class="gain-side gain-side--reward"><img src="assets/intrigue.png" alt="" class="gain-icon" /><span class="gain-amt gain-amt--gain">1</span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
